name: Password recovery targeted tests
on:
  push:
    branches: [main]
    paths:
      - "src/worker.js"
      - "public/app.js"
      - "public/admin.js"
      - "public/recover.html"
      - "public/password.html"
      - "public/login.html"
      - "tests/password-recovery.test.mjs"
      - "tests/edge-recovery.test.mjs"
      - "supabase/functions/itqan-account-recovery/index.ts"
      - "tests/worker.test.mjs"
      - ".github/workflows/password-recovery-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks of affected modules
        run: |
          node --check src/worker.js
          node --check public/app.js
          node --check public/admin.js
          node --check tests/password-recovery.test.mjs
          node --check tests/edge-recovery.test.mjs
      - name: Targeted password recovery and worker tests
        run: node --test tests/password-recovery.test.mjs tests/edge-recovery.test.mjs tests/worker.test.mjs
