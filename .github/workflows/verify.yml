name: Verify Itqan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Cloudflare API authentication and authorization
        run: npm test
      - name: Validate server and browser JavaScript
        run: npm run check
      - name: Verify published assets are restricted to application files
        run: |
          test -f public/index.html
          test -f public/login.html
          test -f public/register.html
          test -f public/admin.html
          test -f public/school.html
          test -f src/worker.js
          test ! -d public/data
          test ! -d public/uploads
  schema-bootstrap:
    # Each job has its own isolated runner and disposable PostgreSQL container.
    # Avoid cross-event cancellation when both push and PR workflows run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Rebuild schema in disposable local Supabase service
        run: |
          supabase init
          supabase start
          supabase db reset --no-seed
      - name: Verify least-privilege migration was applied by bootstrap
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/no_excess_table_grants.sql
      - name: Guard privileged function execution and search path
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/security_definer_contract.sql
      - name: Verify school creation RLS rejects an authenticated non-admin
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/site_admin_school_rls.sql
      - name: Verify privileged admin operations reject other accounts
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/site_admin_operations_rls.sql
      - name: Exercise audited site administration in disposable database
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/site_admin_operations_happy_path.sql
      # The historical employee-started school link workflow is retired in #47.
      # Its original test is preserved for regression history, but the new
      # school-directed invitation test below is the enforced acceptance contract.
      - name: Verify director-issued invitations and recipient consent
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/school_directed_invitations.sql
      - name: Test framework imports, performance windows, evidence and frozen reviews
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/performance_workflows.sql
      - name: Validate private evidence attachment Storage RLS
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/evidence_attachments_rls.sql
      - name: Test historical personnel approvals and transfer in isolated PostgreSQL
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/school_personnel_new_workflow.sql
      - name: Verify intentionally closed RLS tables have no browser DML grants
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/closed_tables_exposure.sql
      - name: Reject disabled user tokens in privileged RPCs
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/disabled_account_rpc_guard.sql
      - name: Enforce live delegation membership and active-account requirements
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/evidence_delegation_live_membership.sql
      - name: Recheck live school scoring permission for evaluators and delegates
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/recheck_scoring_delegation.sql
      - name: Deny disabled consent actors and delegation targets
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/consent_delegation_live_users.sql
      - name: Enforce independent site and school authorization with dual-role matrix
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/separate_site_school_roles.sql
      - name: Assert complete security release migration sequence and role separation
        run: |
          DB_CONTAINER="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/role_separation_release_gate.sql
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup || true
