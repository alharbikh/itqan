name: Read-only Itqan production asset provenance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-audit.yml
      - scripts/verify-public-assets.mjs
      - scripts/verify-deployed-worker.mjs
      - tests/deployment-provenance.test.mjs
      - public/performance.js
      - public/school-invitations.js
      - public/invitations.js
      - public/school-registration.js
      - public/personal.js
      - public/personnel-import-ui.js
      - public/personnel-import-csv.js
      - public/app.js
      - src/worker.js
  pull_request:
    paths:
      - .github/workflows/production-audit.yml
      - scripts/verify-public-assets.mjs
      - scripts/verify-deployed-worker.mjs
      - tests/deployment-provenance.test.mjs
      - public/performance.js
      - public/school-invitations.js
      - public/invitations.js
      - public/school-registration.js
      - public/personal.js
      - public/personnel-import-ui.js
      - public/personnel-import-csv.js
      - public/app.js
      - src/worker.js
  # Detect independent Wrangler deploys even when no GitHub commit changes.
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  published-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pull requests are prospective; compare deployed production with main,
      # not with UI changes that have not been published yet.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare public Cloudflare assets with repository bytes
        run: node scripts/verify-public-assets.mjs
        env:
          ITQAN_PUBLIC_BASE_URL: https://itqan.khmobgm.workers.dev
