<body data-view="login">
  <header><div class="top"><a class="brand" href="/index.html"><span class="logo">إ</span><span>إتقان سمارت برو</span></a>
    <nav aria-label="القائمة الرئيسية"><a href="/index.html">الرئيسية</a><a href="/login.html">الدخول</a><a href="/register.html">حساب جديد</a></nav></div></header>
  <main class="container"><div class="auth-wrap panel"><div class="card-heading"><span class="eyebrow">بوابة الحسابات</span><h1>تسجيل الدخول</h1><p>سجل دخولك بالبريد الإلكتروني المعتمد.</p></div><div id="message" class="alert" hidden role="alert"></div>
 <form id="account-form" autocomplete="on"><label for="email">البريد الإلكتروني<input type="email" id="email" name="email" autocomplete="username" required placeholder="name@example.com"></label>
 <label for="password">كلمة المرور<input type="password" id="password" name="password" autocomplete="current-password" required></label>
 <button type="submit" class="primary">تسجيل الدخول</button></form><p class="note"><a href="/recover.html">نسيت كلمة المرور؟</a></p><p class="note">يُحدد الوصول وفق صلاحيات الحساب المعتمدة في المنصة.</p></div></main>
  <footer>إتقان سمارت برو — منظومة مدرسية بصلاحيات مستقلة لكل مدرسة</footer>
  <script src="/app.js" defer></script>
