<main class="container"><section class="panel auth-wrap"><h1>مكتبتي الشخصية</h1><p>تُحفظ الشواهد لحسابك الشخصي دون اشتراط ارتباط مدرسي، ولا تُشارك مع مدرسة تلقائيًا.</p>
<div id="message" class="alert" role="status" hidden></div><form id="evidence-form">
<label>عنوان الشاهد <input id="evidence-title" required minlength="2" maxlength="250"></label>
<label>الوصف <textarea id="evidence-description" maxlength="4000" rows="3"></textarea></label>
<label>رابط آمن (اختياري) <input id="evidence-link" type="url" placeholder="https://" maxlength="2000"></label>
<button type="submit" class="primary">حفظ الشاهد الشخصي</button></form>
<h2>شواهدي</h2><ul id="evidence-list"></ul></section></main><footer>ملفاتك الشخصية مستقلة عن المدرسة</footer><script src="/personal.js" defer></script></body></html>
