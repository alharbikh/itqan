<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b64"><meta name="robots" content="noindex,nofollow"><title>تغيير كلمة المرور | إتقان سمارت برو</title><link rel="stylesheet" href="/app.css"></head>
<body data-view="password"><header><div class="top"><a class="brand" href="/index.html"><span class="logo">إ</span><span>إتقان سمارت برو</span></a><nav><a href="/login.html">الدخول</a></nav></div></header>
<main class="container"><div class="auth-wrap panel"><div class="card-heading"><span class="eyebrow">أمان الحساب</span><h1>تغيير كلمة المرور</h1><p id="password-guidance">أدخل كلمة المرور الحالية ثم اختر كلمة مرور جديدة.</p></div><div id="message" class="alert" hidden role="status" aria-live="polite"></div>
<form id="password-change-form"><label id="current-password-label" for="current-password">كلمة المرور الحالية<input type="password" id="current-password" autocomplete="current-password"></label>
<label for="password">كلمة المرور الجديدة<input id="password" type="password" minlength="6" autocomplete="new-password" required></label>
<label for="password-confirm">تأكيد كلمة المرور<input id="password-confirm" type="password" minlength="6" autocomplete="new-password" required></label>
<button type="submit" class="primary">تحديث كلمة المرور</button></form><p class="note">كلمة المرور الجديدة يجب أن تتكون من 6 أحرف على الأقل.</p><a href="/login.html" class="button">العودة لتسجيل الدخول</a></div></main><footer>إتقان سمارت برو</footer><script src="/app.js" defer></script></body></html>
