<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b64"><meta name="robots" content="noindex,nofollow"><title>استعادة كلمة المرور | إتقان سمارت برو</title><link rel="stylesheet" href="/app.css"></head>
<body data-view="recover"><header><div class="top"><a class="brand" href="/index.html"><span class="logo">إ</span><span>إتقان سمارت برو</span></a><nav><a href="/login.html">تسجيل الدخول</a></nav></div></header>
<main class="container"><div class="auth-wrap panel"><div class="card-heading"><span class="eyebrow">أمان الحساب</span><h1>استعادة كلمة المرور</h1><p>اطلب رمزًا من البريد المسجل، ثم أدخل الرمز وكلمة المرور الجديدة. لا تشارك الرمز مع أحد.</p></div>
<div class="alert" id="message" hidden role="status" aria-live="polite"></div>
<form id="recovery-request-form"><label for="email">البريد الإلكتروني<input type="email" id="email" name="email" autocomplete="email" maxlength="254" required placeholder="name@example.com"></label><button type="submit" class="primary">إرسال رمز الاستعادة</button></form>
<hr><form id="recovery-complete-form"><h2>تعيين كلمة مرور جديدة</h2><label for="code">رمز الاستعادة من البريد<input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="one-time-code" required></label>
<label for="password">كلمة المرور الجديدة<input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required></label>
<label for="password-confirm">تأكيد كلمة المرور<input type="password" id="password-confirm" autocomplete="new-password" minlength="6" required></label>
<button type="submit" class="primary">حفظ كلمة المرور الجديدة</button></form><p class="note">إذا لم يصل الرمز، راجع البريد غير المرغوب فيه. قد يلزم الانتظار قبل إعادة الطلب.</p><a class="button" href="/login.html">العودة إلى الدخول</a></div></main><footer>إتقان سمارت برو</footer><script src="/app.js" defer></script></body></html>
